name: Build & Deploy

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/steven230500/introduce-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest

      # The deploy key is restricted on the droplet to exactly this command,
      # so a leak of the secret cannot be used as a general shell.
      - name: Deploy to droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: deploy

      - name: Wait for the API to answer
        run: |
          for attempt in $(seq 1 20); do
            if curl -fsS -m 10 https://api.introduce.casavidactg.com/health; then
              echo "deploy healthy"
              exit 0
            fi
            sleep 5
          done
          echo "the API never came back after the deploy"
          exit 1
